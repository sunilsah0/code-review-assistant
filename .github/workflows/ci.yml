name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests benchmark
      - name: Unit tests
        run: pytest -q
      - name: Benchmark (must stay above thresholds)
        run: python -m benchmark.run_benchmark --min-precision 0.9 --min-recall 0.6